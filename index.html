<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRChatを開く</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    #open {
      display: inline-block;
      padding: 16px 28px;
      font-size: 18px;
      text-decoration: none;
      border: 1px solid #999;
      border-radius: 8px;
    }

    #error {
      color: red;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>VRChatを起動します</h1>

  <p>自動で起動しない場合はボタンを押してください。</p>

  <a id="open" href="#">
    VRChatで参加
  </a>

  <p id="error"></p>

  <script>
    let vrchatUrl = null;

    /*
     * 形式1
     *
     * https://neco222.github.io/koisui-join/?vrchat://launch?ref=...
     *
     * ? より後ろを全部そのまま取得する。
     */
    const rawQuery = location.search.substring(1);

    if (rawQuery.startsWith("vrchat://")) {
      vrchatUrl = rawQuery;
    }

    /*
     * 形式2
     *
     * https://neco222.github.io/koisui-join/?url=ENCODE済みURL
     */
    if (!vrchatUrl) {
      const params = new URLSearchParams(location.search);
      const url = params.get("url");

      if (url && url.startsWith("vrchat://")) {
        vrchatUrl = url;
      }
    }

    if (!vrchatUrl) {
      document.getElementById("error").textContent =
        "VRChatリンクが指定されていません。";

      document.getElementById("open").style.display = "none";
    } else {

      console.log("VRChat URL:", vrchatUrl);

      // 直接クリックできるリンクにする
      const openButton = document.getElementById("open");
      openButton.href = vrchatUrl;

      // 自動起動も試す
      setTimeout(() => {
        window.location.href = vrchatUrl;
      }, 700);
    }
  </script>

</body>
</html>
