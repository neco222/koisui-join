<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koisui Join</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Noto Sans JP", sans-serif;
      color: #dfffff;
      background: #004d53;
    }

    body { position: relative; }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 20%, rgba(90,255,255,.08), transparent 25%),
        radial-gradient(circle at 82% 28%, rgba(90,255,255,.06), transparent 24%),
        linear-gradient(180deg, #005b61 0%, #00474d 100%);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(190,255,255,.10) 1px, transparent 1px);
      background-size: 120px 120px;
      opacity: .24;
      animation: drift 18s linear infinite;
    }

    @keyframes drift { to { transform: translateY(40px); } }

    .side-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      color: #00ebf2;
      font-size: clamp(40px, 5vw, 72px);
      font-weight: 800;
      opacity: .75;
      text-shadow: 0 0 14px rgba(0,255,255,.5);
      user-select: none;
      pointer-events: none;
      animation: arrowPulse 1.3s ease-in-out infinite;
    }
    .side-arrow.left { left: 4vw; }
    .side-arrow.right { right: 4vw; }

    @keyframes arrowPulse {
      50% { opacity: 1; transform: translateY(-50%) scale(1.08); }
    }

    .outer-panel {
      position: relative;
      z-index: 5;
      width: min(1200px, 88vw);
      height: min(760px, 84vh);
      margin: 4vh auto;
      border-radius: 24px;
      background: rgba(0, 11, 15, .76);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 0 0 2px rgba(0,255,255,.05),
        0 20px 70px rgba(0,0,0,.35);
    }

    .top-tab {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      padding: 10px 20px;
      border: 4px solid rgba(0,255,255,.5);
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      background: rgba(0,88,96,.65);
      font-weight: 700;
      box-shadow: 0 0 18px rgba(0,255,255,.16);
    }

    .early-access {
      position: absolute;
      top: 28px;
      right: -48px;
      writing-mode: vertical-rl;
      padding: 16px 10px;
      border: 4px solid rgba(194,188,72,.75);
      border-radius: 999px;
      color: rgba(194,188,72,.9);
      font-weight: 700;
      letter-spacing: 2px;
    }

    .inner-panel {
      width: min(760px, 70vw);
      height: min(560px, 62vh);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 46%, rgba(40,255,255,.11), transparent 38%),
        linear-gradient(180deg, rgba(0,92,99,.96), rgba(0,83,90,.96));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.06),
        0 0 40px rgba(0,0,0,.22);
    }

    .circle-wrap {
      position: relative;
      width: 390px;
      height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .glow-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid rgba(82,255,255,.76);
      box-shadow:
        0 0 20px rgba(49,255,255,.5),
        0 0 50px rgba(49,255,255,.2),
        inset 0 0 24px rgba(49,255,255,.12);
    }

    .dashed-ring {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 10px dashed rgba(96,255,255,.14);
      animation: spin 14s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 8px rgba(87,255,255,.7));
    }
    .progress-ring circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .progress-bg { stroke: rgba(130,255,255,.12); }
    .progress-bar {
      stroke: #48f2ff;
      stroke-dasharray: 1036;
      stroke-dashoffset: 1036;
      transition: stroke-dashoffset .25s linear;
    }

    .wave-box {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      width: 205px;
      color: white;
      font-weight: 700;
    }
    .wave-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .wave-svg {
      width: 100%;
      height: 40px;
      overflow: visible;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.3));
    }
    .wave-line {
      fill: none;
      stroke: white;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 300;
      animation: wave 3s linear infinite;
    }
    @keyframes wave { to { stroke-dashoffset: -40; } }

    .content-text {
      position: relative;
      z-index: 2;
      width: 310px;
      margin-top: 58px;
    }

    .main-title {
      color: #11c9d9;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(0,255,255,.16);
    }

    .message {
      margin-top: 25px;
      min-height: 48px;
      color: #f5ffff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
    }

    .sub-message {
      margin-top: 7px;
      min-height: 36px;
      color: rgba(220,255,255,.84);
      font-size: 13px;
      line-height: 1.45;
    }

    .action-btn {
      display: inline-block;
      margin-top: 18px;
      min-width: 210px;
      padding: 12px 24px;
      color: #eaffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      background: rgba(0,100,110,.36);
      border: 4px solid rgba(103,255,255,.48);
      border-radius: 16px;
      box-shadow:
        0 0 12px rgba(0,255,255,.16),
        inset 0 0 10px rgba(0,255,255,.08);
      cursor: pointer;
      transition: .18s ease;
    }
    .action-btn:hover {
      transform: scale(1.035);
      box-shadow:
        0 0 22px rgba(0,255,255,.25),
        inset 0 0 12px rgba(0,255,255,.10);
    }
    .action-btn:active { transform: scale(.97); }

    .hint {
      margin-top: 12px;
      min-height: 18px;
      color: rgba(220,255,255,.72);
      font-size: 12px;
    }

    .flash {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, rgba(75,255,255,.3), transparent 42%);
    }
    body.launching .flash { animation: flashFx .75s ease forwards; }
    @keyframes flashFx {
      0% { opacity: 0; transform: scale(.8); }
      40% { opacity: .6; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.2); }
    }

    @media (max-width: 900px) {
      .outer-panel { width: 94vw; height: 90vh; }
      .inner-panel { width: 86vw; height: 68vh; }
      .circle-wrap { width: 310px; height: 310px; }
      .progress-ring { width: 310px; height: 310px; }
      .wave-box { top: 45px; width: 170px; }
      .content-text { width: 260px; margin-top: 44px; }
      .main-title { font-size: 38px; }
      .message { font-size: 15px; }
      .early-access, .side-arrow { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="side-arrow left">««</div>
  <div class="side-arrow right">»»</div>

  <div class="outer-panel">
    <div class="top-tab">VRChatについて</div>
    <div class="early-access">Early Access</div>

    <div class="inner-panel">
      <div class="circle-wrap">
        <div class="glow-ring"></div>
        <div class="dashed-ring"></div>

        <svg class="progress-ring" viewBox="0 0 360 360" width="390" height="390" aria-hidden="true">
          <circle class="progress-bg" cx="180" cy="180" r="165"></circle>
          <circle class="progress-bar" id="progressBar" cx="180" cy="180" r="165"></circle>
        </svg>

        <div class="wave-box">
          <div class="wave-labels"><span>0%</span><span>100%</span></div>
          <svg class="wave-svg" viewBox="0 0 200 40" aria-hidden="true">
            <path class="wave-line" d="M5 28 C18 28,18 10,32 10 C46 10,46 33,60 33 C74 33,74 8,88 8 C102 8,102 28,116 28 C130 28,130 13,144 13 C158 13,158 27,172 27 C184 27,188 29,195 29" />
          </svg>
        </div>

        <div class="content-text">
          <div class="main-title" id="mainTitle">LOGIN</div>
          <div class="message" id="message">VRChat launch link detected</div>
          <div class="sub-message" id="subMessage">下のボタンを押してVRChatを開いてください。</div>
          <a class="action-btn" id="actionBtn" href="#">VRChatを開く</a>
          <div class="hint" id="hint">ブラウザの確認画面では「VRChatを開く」を選択してください。</div>
        </div>
      </div>
    </div>
  </div>

  <div class="flash"></div>

  <script>
    let vrchatUrl = null;

    // ?vrchat://launch?... 形式
    const rawQuery = location.search.substring(1);
    if (rawQuery.startsWith("vrchat://")) {
      vrchatUrl = rawQuery;
    }

    // ?url=ENCODED 形式
    if (!vrchatUrl) {
      const params = new URLSearchParams(location.search);
      const value = params.get("url");
      if (value && value.startsWith("vrchat://")) {
        vrchatUrl = value;
      }
    }

    // URL全体をエンコードして ?vrchat%3A%2F%2F... と渡した場合にも対応
    if (!vrchatUrl && rawQuery) {
      try {
        const decoded = decodeURIComponent(rawQuery);
        if (decoded.startsWith("vrchat://")) vrchatUrl = decoded;
      } catch (_) {}
    }

    const actionBtn = document.getElementById("actionBtn");
    const mainTitle = document.getElementById("mainTitle");
    const message = document.getElementById("message");
    const subMessage = document.getElementById("subMessage");
    const hint = document.getElementById("hint");
    const progressBar = document.getElementById("progressBar");

    const radius = 165;
    const circumference = 2 * Math.PI * radius;
    progressBar.style.strokeDasharray = circumference;

    function setProgress(percent) {
      progressBar.style.strokeDashoffset = circumference - (percent / 100) * circumference;
    }

    function addLaunchFlag(url) {
      // 2025.3.2以降、既に起動中のVRChatへlaunch linkを渡す場合に launch=1 を利用。
      if (!/[?&]launch=1(?:&|$)/.test(url)) {
        url += (url.includes("?") ? "&" : "?") + "launch=1";
      }
      return url;
    }

    if (!vrchatUrl) {
      mainTitle.textContent = "エラー";
      message.innerHTML = "VRChatリンクが<br>指定されていません";
      subMessage.textContent = "招待リンクからこのページを開いてください。";
      hint.textContent = "";
      actionBtn.style.display = "none";
      setProgress(100);
    } else {
      vrchatUrl = addLaunchFlag(vrchatUrl);

      // 重要: JavaScriptの遅延リダイレクトではなく、実際の <a href="vrchat://..."> を
      // ユーザー自身がクリックすることでカスタムプロトコルを起動する。
      actionBtn.href = vrchatUrl;

      actionBtn.addEventListener("click", () => {
        document.body.classList.add("launching");
        mainTitle.textContent = "OPEN";
        message.textContent = "Opening VRChat...";
        subMessage.textContent = "確認画面でVRChatを開いてください。";
        setProgress(100);
        setTimeout(() => document.body.classList.remove("launching"), 900);
        // preventDefault はしない。href の vrchat:// をブラウザ自身に処理させる。
      });

      // 見た目だけのロード演出。自動で vrchat:// は開かない。
      let progress = 0;
      const timer = setInterval(() => {
        progress += 2.5;
        if (progress >= 86) {
          progress = 86;
          clearInterval(timer);
          message.textContent = "Ready to launch VRChat";
          subMessage.textContent = "「VRChatを開く」を押してください。";
        }
        setProgress(progress);
      }, 45);
    }
  </script>
</body>
</html>
